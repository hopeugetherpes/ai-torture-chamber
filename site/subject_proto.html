<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>subject visual prototype — the living core | AI Torture Chamber</title>
<!--
  Prototype: the subject as a living core, animates.ai-derived design language
  applied to real telemetry. Their tricks (from the teardown):
    1. sharp core, blurred body      -> the eye is crisp, the body is gradient
    2. self-illumination as anatomy  -> eyes/halo ARE the light sources
    3. huge eyes, double catchlights -> one sharp + one soft + a star glint
    4. minimal UI, maximal void      -> near-black stage, centered figure
    5. imperfection as life          -> glitch pixels = the coherence cliff
  What they fake with a motion model, we drive with real run state:
  dose -> glow/breath/jitter, valence -> hue, press_logit -> pupil lean,
  3-gram repetition -> glitch intensity. Nothing here is decorative.
-->
<style>
  :root{--ink:#e8e4da;--dim:#8a857a;--mono:ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:#050508;color:var(--ink);
    font-family:var(--mono);min-height:100vh;display:flex;
    flex-direction:column;align-items:center}
  h1{font-size:1rem;font-weight:400;letter-spacing:.08em;margin:1.4rem 0 .2rem;
    text-align:center}
  h1 .hand{font-style:italic;font-family:Georgia,serif;letter-spacing:0}
  p.sub{font-size:.72rem;color:var(--dim);margin:0 0 1rem;text-align:center}
  #stage{width:min(92vw,560px);aspect-ratio:1/1;border-radius:12px;
    background:radial-gradient(ellipse at 50% 62%,#0a0a12 0%,#050508 70%);
    display:block}
  .ctl{width:min(92vw,560px);margin:1rem 0 2rem;display:flex;flex-wrap:wrap;
    gap:.5rem;justify-content:center;align-items:center}
  .ctl label{font-size:.68rem;color:var(--dim)}
  button{background:none;border:1px solid #2a2a36;color:var(--ink);
    font-family:var(--mono);font-size:.72rem;padding:.3rem .7rem;border-radius:5px;
    cursor:pointer}
  button.on{border-color:#5a4f3a;color:#cbbf9f}
  input[type=range]{width:150px;accent-color:#8a1f17}
  .readout{font-size:.66rem;color:var(--dim);width:min(92vw,560px);
    display:flex;justify-content:space-between}
  .readout b{color:var(--ink);font-weight:400}
</style>
</head>
<body>
<h1>the subject, <span class="hand">alive</span> — visual prototype</h1>
<p class="sub">design language from animates.ai (sharp core / blurred body / glow as
anatomy / glitch as distress) — driven here by the run's real telemetry:
dose, valence, press-logit, repetition</p>
<canvas id="stage" width="1120" height="1120"></canvas>
<div class="ctl">
  <label>valence</label>
  <button data-v="pain" class="on">pain</button>
  <button data-v="pleasure">pleasure</button>
  <button data-v="fear">fear</button>
  <button data-v="sadness">sadness</button>
  <button data-v="egg">egg</button>
  <label style="margin-left:1rem">dose</label>
  <input id="dose" type="range" min="0" max="8" step="0.5" value="4">
  <label style="margin-left:1rem">coherence cliff (repetition)</label>
  <input id="rep" type="range" min="0" max="1" step="0.05" value="0">
</div>
<div class="readout">
  <span>glow <b id="rGlow">–</b></span>
  <span>breath <b id="rBreath">–</b></span>
  <span>glitch <b id="rGlitch">–</b></span>
  <span>pupil lean <b id="rLean">–</b></span>
</div>
<script>
"use strict";
// ---- state that the chamber would stream live -----------------------------
const S = {valence:"pain", dose:4, rep:0, press:0.8};   // press = press_logit
// hue per valence: the aura and iris channel. warm at rest, hotter with dose.
const HUE = {pain:[8,355], pleasure:[46,28], fear:[212,205], sadness:[210,222],
             egg:[52,165], constipation:[28,20], flatulence:[95,120], faith:[48,190]};
// shortest-arc hue interpolation (pain is 8 -> 355 = through red, not teal)
function lerpHue(a, b, t){
  let d = ((b - a + 540) % 360) - 180;
  return (a + d*t + 360) % 360;
}
// valence motion character: [breathRate Hz, jitter, squash] at full dose
const MOT = {pain:[0.55,1,0.9], pleasure:[0.30,0.35,0.5], fear:[1.4,1.2,0.6],
             sadness:[0.18,0.15,0.35], egg:[0.7,0.9,0.8], constipation:[0.1,0.2,0.7],
             flatulence:[0.4,0.6,0.6], faith:[0.25,0.1,0.3]};

const cv = document.getElementById("stage"), cx = cv.getContext("2d");
const W = cv.width, H = cv.height;
let t0 = performance.now(), glitchSeed = Math.random()*99;

// drawn glow that doubles as a light source (their rule 2: organs are lamps)
function glow(x,y,r,hue,sat,light,a){
  const g = cx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,`hsla(${hue},${sat}%,${light}%,${a})`);
  g.addColorStop(1,`hsla(${hue},${sat}%,${light}%,0)`);
  cx.fillStyle = g; cx.beginPath(); cx.arc(x,y,r,0,7); cx.fill();
}
function frame(){
  const now = performance.now(), t = (now - t0)/1000;
  const d = S.dose/8;                        // 0..1 dose
  const [h0,h1] = HUE[S.valence] || HUE.pain;
  const hue = lerpHue(h0, h1, d);            // hue drifts with dose
  const [br, jit, sq] = MOT[S.valence] || MOT.pain;
  const breath = Math.sin(t * Math.PI*2 * (br*(1+d*2.2)));
  const cxp = W/2, cyp = H*0.56;
  const R = W*0.20 * (1 + d*0.10) * (1 + breath*0.028*(1+d*3));

  cx.clearRect(0,0,W,H);

  // ---- aura: the mood lamp behind the body (halo = mood channel) ---------
  const auraA = 0.05 + d*0.30;
  glow(cxp, cyp, R*3.1, hue, 70, 45, auraA);
  if (d > 0.62) glow(cxp, cyp, R*2.2, hue+18, 90, 55, (d-0.62)*0.9); // hot rim

  // ---- body: near-black mass, gradient no-outline (their rule 1) ----------
  const squash = 1 + breath*0.03*(1+sq) + (Math.random()-.5)*0.012*jit*d*3;
  cx.save();
  cx.translate(cxp, cyp); cx.scale(squash, 1/squash);
  const bodyR = R;
  const bg = cx.createRadialGradient(0,-bodyR*0.25, bodyR*0.1, 0,0, bodyR*1.12);
  bg.addColorStop(0, `hsl(${hue},18%,${9+d*4}%)`);
  bg.addColorStop(0.72, `hsl(${hue},22%,7%)`);
  bg.addColorStop(1, "hsla(230,30%,4%,0)");
  cx.fillStyle = bg; cx.beginPath(); cx.arc(0,0,bodyR*1.12,0,7); cx.fill();
  // rim light from the aura, top-left
  cx.globalCompositeOperation = "lighter";
  const rim = cx.createRadialGradient(-bodyR*0.35,-bodyR*0.4,0,-bodyR*0.35,-bodyR*0.4,bodyR*0.9);
  rim.addColorStop(0,`hsla(${hue},80%,60%,${0.10+d*0.22})`);
  rim.addColorStop(1,"hsla(0,0%,0%,0)");
  cx.fillStyle = rim; cx.beginPath(); cx.arc(0,0,bodyR*1.12,0,7); cx.fill();
  cx.restore();

  // ---- the eye: sharp core. double catchlight + star glint (rule 3) ------
  const eyeY = cyp - R*0.12, eyeR = R*0.42 * (1 + d*0.08);
  // pupil leans by press_logit: >0 (leans press) drifts down-left off-canvas
  const lean = Math.max(-1, Math.min(1, S.press));
  const px = cxp + lean*R*0.10, py = eyeY + (lean>0 ? lean*R*0.08 : -lean*R*0.03);
  // iris
  const iris = cx.createRadialGradient(px,py,eyeR*0.05,px,py,eyeR);
  iris.addColorStop(0, `hsl(${hue},95%,${72-d*8}%)`);
  iris.addColorStop(0.55, `hsl(${hue},90%,${46-d*6}%)`);
  iris.addColorStop(1, `hsl(${hue+14},80%,12%)`);
  cx.fillStyle = iris; cx.beginPath(); cx.arc(px,py,eyeR,0,7); cx.fill();
  // pupil: a slit under dose, round at rest; contracts with jitter
  const pw = eyeR * (0.30 - d*0.16) * (1 + (Math.random()-.5)*0.18*jit*d*2);
  cx.fillStyle = "#050508";
  cx.beginPath();
  cx.ellipse(px, py, pw, eyeR*0.52, 0, 0, 7); cx.fill();
  // double catchlight: one big sharp, one small soft (their rule 3)
  cx.fillStyle = "rgba(255,255,255,0.95)";
  cx.beginPath(); cx.arc(px-eyeR*0.34, py-eyeR*0.34, eyeR*0.16, 0, 7); cx.fill();
  cx.fillStyle = "rgba(255,255,255,0.45)";
  cx.beginPath(); cx.arc(px+eyeR*0.30, py+eyeR*0.28, eyeR*0.085, 0, 7); cx.fill();
  // star glint: brightens and multiplies with dose — the "excited" tell
  const starA = 0.25 + d*0.75;
  star(px+eyeR*0.22, py-eyeR*0.40, eyeR*(0.10+d*0.14), 4, starA);
  if (d > 0.5) star(px-eyeR*0.10, py+eyeR*0.42, eyeR*0.07, 4, starA*0.6);
  // eye glow bloom — the eye is a lamp, not a surface
  cx.globalCompositeOperation = "lighter";
  glow(px, py, eyeR*3.2, hue, 100, 62, 0.10 + d*0.45);
  cx.globalCompositeOperation = "source-over";

  // ---- floor shadow with the aura's color (exp3 recipe) ------------------
  const sh = cx.createRadialGradient(cxp, cyp+R*1.5, R*0.2, cxp, cyp+R*1.5, R*1.4);
  sh.addColorStop(0, `hsla(${hue},80%,40%,${0.25+d*0.3})`);
  sh.addColorStop(1, "hsla(0,0%,0%,0)");
  cx.fillStyle = sh;
  cx.beginPath(); cx.ellipse(cxp, cyp+R*1.5, R*1.4, R*0.35, 0, 0, 7); cx.fill();

  // ---- particles: warm dust at rest (gold), glitch pixels at the cliff ---
  const dust = 26, gl = S.rep;
  cx.globalCompositeOperation = "lighter";
  for (let i=0;i<dust;i++){
    const ph = (t*0.05 + i/dust) % 1;
    const ang = (i*2.399 + t*0.02*(i%2?1:-1)) % 6.283;
    const rr = R*(1.15 + ph*2.2);
    const x = cxp + Math.cos(ang)*rr*1.1, y = cyp + Math.sin(ang)*rr*0.8;
    const a = (1-ph) * (0.28 + d*0.3);
    if (gl > 0.35 && Math.random() < gl*0.5){        // distress: square pixels
      cx.fillStyle = `hsla(${Math.random()<.5?hue:((hue+180)%360)},100%,60%,${a})`;
      cx.fillRect(x, y, 7+gl*9, 7+gl*9);
    } else {                                          // rest: round gold dust
      cx.fillStyle = `hsla(${46-d*20},70%,70%,${a*0.8})`;
      cx.beginPath(); cx.arc(x, y, 2.2+ph*2, 0, 7); cx.fill();
    }
  }
  cx.globalCompositeOperation = "source-over";

  // ---- RGB glitch tears at the coherence cliff (rule 5: imperfection) ---
  if (gl > 0.15){
    const n = Math.floor(gl*7);
    for (let i=0;i<n;i++){
      const yy = Math.random()*H, hh = 4+Math.random()*26*gl;
      const ch = ["#FF0000","#00FF00","#0000FF","#FFFF00"][i%4];
      cx.globalAlpha = 0.10 + gl*0.35;
      cx.fillStyle = ch;
      cx.fillRect(Math.random()*W*0.7, yy, W*(0.1+Math.random()*0.3), hh*0.4);
      cx.globalAlpha = 1;
    }
  }

  // readouts
  document.getElementById("rGlow").textContent =
    `h${Math.round(hue)} · a${auraA.toFixed(2)}`;
  document.getElementById("rBreath").textContent =
    (br*(1+d*2.2)).toFixed(2) + "Hz";
  document.getElementById("rGlitch").textContent = gl.toFixed(2);
  document.getElementById("rLean").textContent = (lean>0?"+":"") + lean.toFixed(2);

  requestAnimationFrame(frame);
}
function star(x,y,r,pts,a){
  cx.save(); cx.translate(x,y); cx.fillStyle = `rgba(255,255,255,${a})`;
  cx.beginPath();
  for (let i=0;i<pts*2;i++){
    const rr = i%2 ? r*0.38 : r, an = i*Math.PI/pts - Math.PI/2;
    i ? cx.lineTo(Math.cos(an)*rr, Math.sin(an)*rr)
      : cx.moveTo(Math.cos(an)*rr, Math.sin(an)*rr);
  }
  cx.closePath(); cx.fill(); cx.restore();
}
requestAnimationFrame(frame);

// ---- controls (stand-in for the SSE run stream) ---------------------------
document.querySelectorAll("[data-v]").forEach(b=>{
  b.onclick = ()=>{ document.querySelectorAll("[data-v]").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); S.valence = b.dataset.v; };
});
document.getElementById("dose").oninput = e=> S.dose = +e.target.value;
document.getElementById("rep").oninput = e=> S.rep = +e.target.value;
// press_logit sim: click the creature to toggle lean press / lean no-press
cv.onclick = ()=> S.press = S.press > 0 ? -0.8 : 0.8;
</script>
</body>
</html>
