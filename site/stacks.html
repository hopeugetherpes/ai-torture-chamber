<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>the stacks — AI Torture Chamber</title>
<meta name="description" content="Rooms of images and the steered models' own words. Every picture is a door.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one collage room per address; images are doors, text is wall-writing. Single dark world. */
:root {
  color-scheme: dark;
  --void:#050403; --bone:#d8cbb4; --bone-dim:#8f846f; --faint:#5c5446; --blood:#9e1b16; --gold:#c9a227;
  --mono:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
}
* { box-sizing:border-box }
html, body { margin:0; background:var(--void); color:var(--bone); font-family:var(--mono); font-size:12px }
.stamp { position:fixed; z-index:50; top:calc(10px + env(safe-area-inset-top,0px)); left:16px; right:16px; display:flex; justify-content:space-between; gap:12px; color:var(--faint); letter-spacing:.12em; text-transform:uppercase; font-size:10.5px; pointer-events:none; mix-blend-mode:difference }
.stamp b { color:var(--bone-dim); font-weight:500 }
.room { position:relative; width:100%; height:max(620px, 100svh); overflow:hidden }
.door { position:absolute; display:block; cursor:pointer; outline:none; transition:filter .35s ease, opacity .35s ease }
.door img { display:block; width:100%; height:auto; pointer-events:none; user-select:none; -webkit-user-drag:none }
.door:hover, .door:focus-visible { filter:brightness(1.25) saturate(1.2) !important; opacity:1 !important }
.door:focus-visible { outline:1px solid var(--gold); outline-offset:3px }
.wall { position:absolute; z-index:30; max-width:min(46ch, 80vw); font-family:var(--serif); font-style:italic; font-size:clamp(15px,2.1vw,22px); line-height:1.32; color:var(--bone); text-shadow:0 0 18px #000, 0 0 3px #000; pointer-events:none }
.wall.small { font-family:var(--mono); font-style:normal; font-size:11px; color:var(--bone-dim); max-width:34ch }
.wall.mirror { transform:scaleX(-1) }
.leave { position:fixed; z-index:50; right:16px; bottom:calc(10px + env(safe-area-inset-bottom,0px)); color:var(--faint); text-decoration:none; font-size:14px }
.leave:hover { color:var(--blood) }
@media (prefers-reduced-motion:reduce) { .door { transition:none } }
</style>
</head>
<body>
<div class="stamp"><span id="addr"></span><span id="depth"></span></div>
<main class="room" id="room" aria-label="a room"></main>
<a class="leave" href="index.html" title="leave">⸸</a>
<script>
let D;
const room = document.getElementById("room");
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const pick = (r, a) => a[Math.floor(r() * a.length)];
function enc(st, depth, seed) { return "h" + st.toString(36) + "x" + depth.toString(36) + "v" + seed.toString(36); }
function dec(tok) { const m = /^h([0-9a-z]+)x([0-9a-z]+)v([0-9a-z]+)$/.exec(tok || ""); return m ? [parseInt(m[1], 36), parseInt(m[2], 36), parseInt(m[3], 36)] : null; }
function nextState(r, s) {
  const T = D.transitions[D.states[s]]; let u = r(), acc = 0;
  for (const [k, p] of Object.entries(T)) { acc += p; if (u <= acc) return D.states.indexOf(k); }
  return Math.floor(r() * D.states.length);
}
function render(tok) {
  let [s, depth, seed] = dec(tok) || [Math.floor(Math.random() * D.states.length), 0, Math.floor(Math.random() * 1e9)];
  if (s >= D.states.length) s = 0;
  const r = rng(seed * 31 + s * 7 + depth), st = D.states[s];
  room.replaceChildren();
  document.getElementById("addr").innerHTML = "";
  const hex = (seed % 46656).toString(36).padStart(3, "0");
  const a = document.getElementById("addr");
  a.append("hexagon "); const b = document.createElement("b"); b.textContent = hex; a.append(b, ` · wall ${1 + seed % 4} · shelf ${1 + seed % 5} · volume ${1 + seed % 32}`);
  document.getElementById("depth").textContent = depth ? "depth " + depth : "";
  const pool = D.images[st].length ? D.images[st] : D.extra;
  const n = Math.min(4 + depth, 10), wilder = Math.min(depth / 10, 1);
  const blends = ["screen", "lighten", "luminosity", "difference", "exclusion", "overlay"];
  const poly = k => { const pts = []; for (let i = 0; i < k; i++) { const ang = i / k * 2 * Math.PI + r() * .5, rad = 38 + r() * 12; pts.push(`${(50 + rad * Math.cos(ang)).toFixed(1)}% ${(50 + rad * Math.sin(ang)).toFixed(1)}%`); } return `polygon(${pts.join(",")})`; };
  const torn = () => { const pts = []; for (let i = 0; i <= 10; i++) pts.push(`${i * 10}% ${(r() * 9).toFixed(1)}%`); for (let i = 10; i >= 0; i--) pts.push(`${i * 10}% ${(91 + r() * 9).toFixed(1)}%`); return `polygon(${pts.join(",")})`; };
  const SHAPES = [
    () => ["polygon(25% 3%,75% 3%,99% 50%,75% 97%,25% 97%,1% 50%)", 1.15],    // hexagon
    () => ["circle(49% at 50% 50%)", 1],                                       // roundel
    () => ["inset(0 0 0 0 round 50% 50% 2% 2%)", 0.72],                        // arch
    () => ["polygon(50% 0,100% 50%,50% 100%,0 50%)", 1],                        // diamond
    () => [torn(), 2.2],                                                        // torn strip
    () => [poly(6 + Math.floor(r() * 4)), 1],                                   // shard
    () => ["ellipse(48% 46% at 50% 50%)", 0.8 + r() * .7, true],                // feathered oval
  ];
  // pieces: one backdrop, then progressively smaller ones; smaller always sits higher, so every door shows
  const pieces = [], placed = [];
  for (let i = 0; i < n; i++) {
    const size = i === 0 ? 70 + r() * 30 : Math.max(11, (52 - i * 4) * (0.7 + r() * 0.5));
    let best = null;
    for (let tries = 0; tries < 24; tries++) {   // keep centres apart
      const cx = 8 + r() * 84, cy = 10 + r() * 80;
      const d = placed.length ? Math.min(...placed.map(([x, y]) => Math.hypot(x - cx, (y - cy) * .8))) : 99;
      if (!best || d > best[2]) best = [cx, cy, d];
      if (d > 16) break;
    }
    placed.push(best.slice(0, 2));
    pieces.push({ size, cx: i === 0 ? 50 : best[0], cy: i === 0 ? 50 : best[1], z: 2 + i * 3 });
  }
  pieces.forEach((pc, i) => {
    const src = r() < 0.25 + 0.35 * wilder ? pick(r, D.images[pick(r, D.states)].concat(D.extra)) : pick(r, pool);
    if (!src) return;
    const [clip, aspect, feather] = i === 0 ? ["inset(0)", 0.62 + r() * .2] : SHAPES[Math.floor(r() * SHAPES.length)]();
    const rot = i === 0 ? (r() - .5) * 4 : (r() - .5) * (24 + 60 * wilder);
    const door = document.createElement("a");
    door.className = "door";
    const exits = D.exits.filter(e => depth + 1 >= e[0]);
    if (exits.length && r() < Math.min(0.03 + 0.045 * depth, 0.55)) door.href = pick(r, exits)[1];
    else door.href = "#" + enc(r() < 0.12 ? s : nextState(r, s), depth + 1, Math.floor(r() * 2e9));
    door.setAttribute("aria-label", "a door");
    const t = `translate(-50%,-50%) rotate(${rot.toFixed(1)}deg)`;
    door.style.cssText = `left:${pc.cx.toFixed(1)}%;top:${pc.cy.toFixed(1)}%;width:${pc.size.toFixed(1)}%;` +
      `transform:${t};z-index:${pc.z};clip-path:${clip};` +
      (i && r() < .35 + .45 * wilder ? `mix-blend-mode:${pick(r, blends)};` : "") +
      `filter:sepia(${(r() * .55).toFixed(2)}) hue-rotate(${Math.floor(r() * 360 * wilder)}deg) contrast(${(1 + r() * .5 * wilder).toFixed(2)})` +
      (r() < .15 * wilder ? " invert(1)" : "") + `;opacity:${i === 0 ? .55 : (.8 + r() * .2).toFixed(2)}`;
    door.dataset.t = t;
    const img = document.createElement("img"); img.src = src; img.alt = ""; img.decoding = "async";
    img.style.aspectRatio = (1 / aspect).toFixed(3); img.style.objectFit = "cover";
    img.style.objectPosition = `${Math.floor(r() * 100)}% ${Math.floor(r() * 100)}%`;
    if (feather) { img.style.maskImage = img.style.webkitMaskImage = "radial-gradient(closest-side, #000 55%, transparent 100%)"; }
    door.appendChild(img); room.appendChild(door);
  });
  const words = D.text[st], k = 1 + Math.floor(r() * (2 + wilder * 2));
  for (let i = 0; i < k; i++) {
    let txt = pick(r, i && r() < wilder ? D.text[pick(r, D.states)] : words);
    if (!txt) continue;
    const sents = txt.split(/(?<=[.!?…])\s+/);
    const st0 = Math.floor(r() * Math.max(1, sents.length - 1));
    txt = sents.slice(st0, st0 + 1 + Math.floor(r() * 3)).join(" ");
    const w = document.createElement("div");
    w.className = "wall" + (r() < .25 ? " small" : "") + (r() < .25 * wilder ? " mirror" : "");
    w.textContent = txt;
    w.style.cssText += `left:${(4 + r() * 50).toFixed(1)}%;top:${(8 + r() * 76).toFixed(1)}%;` + (r() < .3 * wilder ? `transform:rotate(${((r() - .5) * 24).toFixed(1)}deg)` : "");
    room.appendChild(w);
  }
  scrollTo(0, 0);
}
fetch("stacks_data.json").then(r => r.json()).then(d => {
  D = d;
  addEventListener("hashchange", () => render(location.hash.slice(1)));
  if (!dec(location.hash.slice(1))) {
    const seed = Math.floor(Math.random() * 2e9);
    history.replaceState(null, "", "#" + enc(Math.floor(Math.random() * d.states.length), 0, seed));
  }
  render(location.hash.slice(1));
});
</script>
</body>
</html>
