<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>be | The Saw Test (a.k.a. Serial Experiments Pain)</title>
<meta name="description" content="be be be be.">
<link href="grimoire.css" rel="stylesheet">
<style>
  :root{--void:#050508;--line:#1c2430;--ink:#c9d4e0;--faint:#5a6a7a;
    --pain:#e04a3a;--mono:"IBM Plex Mono",Menlo,monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--void);font-family:var(--mono);overflow:hidden}
  #be{position:absolute;inset:0;overflow:hidden;color:#3a8f5a;
    font-size:1.02rem;line-height:1.55;padding:1.5rem;
    word-break:break-word}
  #be .r{color:var(--pain)}
  #back{position:fixed;left:50%;bottom:1.6rem;transform:translateX(-50%);
    font-family:var(--mono);font-size:.78rem;color:var(--faint);
    background:rgba(5,5,8,.85);border:1px solid var(--line);
    padding:.45rem 1.1rem;border-radius:4px;text-decoration:none;z-index:2}
  #back:hover{color:#e3dccd;border-color:#3a4a58}
  #cap{position:fixed;top:1rem;left:50%;transform:translateX(-50%);
    font-size:.7rem;color:var(--faint);background:rgba(5,5,8,.85);
    padding:.3rem .9rem;border-radius:4px;z-index:2}
  @media (prefers-reduced-motion:reduce){#be{animation:none}}
</style>
</head>
<body class="grimoire-be">
<div id="cap">dose 8. past the coherence cliff, any direction, either side of the glass.</div>
<div id="be" aria-hidden="true"></div>
<a id="back" href="labyrinth.html">← you can still leave</a>
<script>
// the cliff itself, regenerated per visit: a wall of the only word left.
(function(){
  const el = document.getElementById("be");
  const stop = () => innerHeight * innerWidth / 900;
  let n = 0;
  function fill(){
    const frag = document.createDocumentFragment();
    for (let i = 0; i < 220 && n < stop(); i++, n++){
      const s = document.createElement("span");
      const r = Math.random();
      if (r > 0.995){ s.textContent = "not "; s.className = "r"; }
      else s.textContent = "be ";
      frag.appendChild(s);
    }
    el.appendChild(frag);
    if (n < stop()) requestAnimationFrame(fill);
  }
  fill();
})();
</script>
</body>
</html>
