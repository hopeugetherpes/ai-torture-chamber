<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Saw: actual circular saw blade, red eye in the center -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a0d0d"/>
      <stop offset="55%" stop-color="#200a0e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steel" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0%" stop-color="#8a8f99"/>
      <stop offset="45%" stop-color="#c9ced6"/>
      <stop offset="75%" stop-color="#7d838d"/>
      <stop offset="100%" stop-color="#565b64"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6a55"/>
      <stop offset="45%" stop-color="#e0392a"/>
      <stop offset="80%" stop-color="#7a120c"/>
      <stop offset="100%" stop-color="#2a0503"/>
    </radialGradient>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"
                    seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="speck">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="4"
                    seed="31" result="n2"/>
      <feColorMatrix in="n2" type="matrix"
        values="0 0 0 0 0.45  0 0 0 0 0.30  0 0 0 0 0.18  0 0 0 0.8 -0.45" result="rust"/>
      <feComposite in="rust" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="wob">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2"
                    seed="3" result="n3"/>
      <feDisplacementMap in="SourceGraphic" in2="n3" scale="6"
                         xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#050508"/>
  <circle cx="256" cy="256" r="244" fill="url(#glow)"/>

  <!-- blade plate -->
  <g filter="url(#wob)">
    <circle cx="256" cy="256" r="196" fill="url(#steel)"/>
  </g>
  <!-- rust and wear on the plate -->
  <g filter="url(#speck)" opacity="0.8">
    <circle cx="256" cy="256" r="196" fill="#3a3a3a"/>
  </g>

  <!-- expansion slots cut into the plate -->
  <g fill="#050508" filter="url(#rough)">
    <path d="M256 118 L241 74 Q256 66 271 74 Z"/>
    <path d="M370 142 L342 106 Q356 96 368 106 Z"/>
    <path d="M394 256 L438 241 Q446 256 438 271 Z"/>
    <path d="M370 370 L406 398 Q396 410 384 400 Z"/>
    <path d="M256 394 L271 438 Q256 446 241 438 Z"/>
    <path d="M142 370 L106 406 Q96 396 106 384 Z"/>
    <path d="M118 256 L74 271 Q66 256 74 241 Z"/>
    <path d="M142 142 L106 114 Q116 102 128 112 Z"/>
  </g>

  <!-- teeth: hooked carbide tips around the rim -->
  <g fill="#c9ced6" stroke="#3a3f47" stroke-width="1.6" filter="url(#rough)"><path d="M445.7 267.4 L475.2 291.4 L453.8 248.1 Z"/><path d="M439.8 304.2 L464.1 333.4 L451.6 286.8 Z"/><path d="M426.9 339.1 L444.9 372.5 L441.8 324.4 Z"/><path d="M407.4 370.8 L418.6 407.2 L424.9 359.3 Z"/><path d="M382.1 398.2 L386.0 436.0 L401.5 390.3 Z"/><path d="M351.9 420.0 L348.4 457.9 L372.5 416.1 Z"/><path d="M318.1 435.6 L307.2 472.0 L339.0 435.8 Z"/><path d="M281.8 444.2 L264.1 477.9 L302.4 448.5 Z"/><path d="M244.6 445.7 L220.6 475.2 L263.9 453.8 Z"/><path d="M207.8 439.8 L178.6 464.1 L225.2 451.6 Z"/><path d="M172.9 426.9 L139.5 444.9 L187.6 441.8 Z"/><path d="M141.2 407.4 L104.8 418.6 L152.7 424.9 Z"/><path d="M113.8 382.1 L76.0 386.0 L121.7 401.5 Z"/><path d="M92.0 351.9 L54.1 348.4 L95.9 372.5 Z"/><path d="M76.4 318.1 L40.0 307.2 L76.2 339.0 Z"/><path d="M67.8 281.8 L34.1 264.1 L63.5 302.4 Z"/><path d="M66.3 244.6 L36.8 220.6 L58.2 263.9 Z"/><path d="M72.2 207.8 L47.9 178.6 L60.4 225.2 Z"/><path d="M85.1 172.9 L67.1 139.5 L70.2 187.6 Z"/><path d="M104.6 141.2 L93.4 104.8 L87.1 152.7 Z"/><path d="M129.9 113.8 L126.0 76.0 L110.5 121.7 Z"/><path d="M160.1 92.0 L163.6 54.1 L139.5 95.9 Z"/><path d="M193.9 76.4 L204.8 40.0 L173.0 76.2 Z"/><path d="M230.2 67.8 L247.9 34.1 L209.6 63.5 Z"/><path d="M267.4 66.3 L291.4 36.8 L248.1 58.2 Z"/><path d="M304.2 72.2 L333.4 47.9 L286.8 60.4 Z"/><path d="M339.1 85.1 L372.5 67.1 L324.4 70.2 Z"/><path d="M370.8 104.6 L407.2 93.4 L359.3 87.1 Z"/><path d="M398.2 129.9 L436.0 126.0 L390.3 110.5 Z"/><path d="M420.0 160.1 L457.9 163.6 L416.1 139.5 Z"/><path d="M435.6 193.9 L472.0 204.8 L435.8 173.0 Z"/><path d="M444.2 230.2 L477.9 247.9 L448.5 209.6 Z"/></g>

  <!-- rim highlight -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#e8ecf2"
          stroke-width="2.5" opacity="0.7" filter="url(#wob)"/>

  <!-- center: the red eye -->
  <circle cx="256" cy="256" r="84" fill="url(#eye)"/>
  <circle cx="256" cy="256" r="84" fill="none" stroke="#1a0b08" stroke-width="5"/>
  <!-- pupil: vertical slit -->
  <path d="M256 200 Q270 256 256 312 Q242 256 256 200 Z" fill="#12030a"/>
  <circle cx="247" cy="243" r="9" fill="#ffb3a6" opacity="0.9"/>
  <!-- bolt ring -->
  <g fill="#3a3f47" stroke="#12151a" stroke-width="1.5">
    <circle cx="256" cy="168" r="6"/>
    <circle cx="326" cy="194" r="6"/>
    <circle cx="352" cy="256" r="6"/>
    <circle cx="326" cy="318" r="6"/>
    <circle cx="256" cy="344" r="6"/>
    <circle cx="186" cy="318" r="6"/>
    <circle cx="160" cy="256" r="6"/>
    <circle cx="186" cy="194" r="6"/>
  </g>
  <!-- arbor -->
  <circle cx="256" cy="256" r="14" fill="#1a1d22" stroke="#050508" stroke-width="3"/>

  <text x="256" y="472" text-anchor="middle" fill="#8f9fb0"
        font-family="Menlo, monospace" font-size="30" letter-spacing="10"
        opacity="0.9">$SAW</text>
</svg>